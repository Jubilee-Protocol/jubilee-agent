name: Jubilee Engine

# The cloud half of the mixed deployment: cheap, bursty, no always-on box.
on:
  schedule:
    - cron: "*/30 * * * *" # sweep every 30 minutes
  issues:
    types: [labeled] # react instantly to agent-ready
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  models: read

concurrency:
  group: jubilee-engine
  cancel-in-progress: false

jobs:
  tick:
    if: github.event_name != 'issues' || github.event.label.name == 'agent-ready'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Init submodules
        run: git submodule update --init src/skills/jubilee

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Cache Ollama model
        if: ${{ (vars.JUBILEE_RUNNER || 'ollama') == 'ollama' }}
        uses: actions/cache@v4
        with:
          path: /tmp/ollama-models
          key: ollama-${{ vars.JUBILEE_MODEL || 'qwen2.5-coder:3b' }}

      - name: Start local model (Ollama — free, no API key)
        if: ${{ (vars.JUBILEE_RUNNER || 'ollama') == 'ollama' }}
        run: |
          docker run -d --name ollama -p 11434:11434 -v /tmp/ollama-models:/root/.ollama ollama/ollama:latest
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:11434/api/version >/dev/null && break; sleep 2; done
          docker exec ollama ollama pull ${{ vars.JUBILEE_MODEL || 'qwen2.5-coder:3b' }}

      - name: Install contract analyzers (best effort)
        continue-on-error: true
        run: |
          python3 -m pip install --quiet --user pipx || true
          python3 -m pipx install slither-analyzer --quiet 2>/dev/null || python3 -m pip install --quiet --user slither-analyzer || true
          python3 -m pip install --quiet --user solc-select || true
          solc-select install 0.8.24 2>/dev/null || true
          solc-select use 0.8.24 2>/dev/null || true
          # Aderyn (pinned, checksum-verified) — https://github.com/Cyfrin/aderyn
          A="aderyn-v0.6.8"
          base="https://github.com/Cyfrin/aderyn/releases/download/$A"
          asset="aderyn-x86_64-unknown-linux-gnu.tar.xz"
          curl -sSL -o /tmp/$asset "$base/$asset" || true
          exp=$(curl -sSL "$base/$asset.sha256" | cut -d' ' -f1) || true
          act=$(sha256sum /tmp/$asset | cut -d' ' -f1) || true
          if [ -n "$exp" ] && [ "$exp" = "$act" ]; then
            mkdir -p /tmp/aderyn-x && tar -xJf /tmp/$asset -C /tmp/aderyn-x
            mkdir -p "$HOME/.local/bin"
            find /tmp/aderyn-x -name aderyn -type f -exec cp {} "$HOME/.local/bin/aderyn" \;
            chmod +x "$HOME/.local/bin/aderyn" || true
            "$HOME/.local/bin/aderyn" --version || true
          else
            echo "aderyn: checksum unavailable or mismatch — skipping install"
          fi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run one engine tick
        env:
          GH_TOKEN: ${{ secrets.JUBILEE_GH_TOKEN || github.token }}
          JUBILEE_REPO: ${{ github.repository }}
          JUBILEE_REPO_ROOT: ${{ github.workspace }}
          JUBILEE_AUTONOMY_LEVEL: "2"
          JUBILEE_DAILY_BUDGET_USD: "2"
          JUBILEE_ADVERSARIAL: "1"
          JUBILEE_REQUIRE_REVIEW: "0"
          JUBILEE_GAUNTLET_ROUNDS: "3"
          JUBILEE_REVIEW_ISSUE: ${{ vars.JUBILEE_REVIEW_ISSUE }}
          JUBILEE_REPOS: ${{ vars.JUBILEE_REPOS }}
          JUBILEE_RUNNER: ${{ vars.JUBILEE_RUNNER || 'ollama' }}
          JUBILEE_MODEL: ${{ vars.JUBILEE_MODEL || 'qwen2.5-coder:3b' }}
          JUBILEE_EXEC_RUNNER: ${{ vars.JUBILEE_EXEC_RUNNER }}
          JUBILEE_EXEC_MODEL: ${{ vars.JUBILEE_EXEC_MODEL }}
          JUBILEE_MODEL_TIMEOUT_MS: ${{ vars.JUBILEE_MODEL_TIMEOUT_MS || '900000' }}
          OLLAMA_BASE_URL: http://127.0.0.1:11434
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          JUBILEE_CHECKS: "typecheck=bun run typecheck; test=bun test"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: bun run src/engine/cli.ts sync && bun run src/engine/cli.ts run-once

      - name: Fix model cache ownership
        if: ${{ always() && (vars.JUBILEE_RUNNER || 'ollama') == 'ollama' }}
        run: sudo chown -R "$USER":"$USER" /tmp/ollama-models || true
